[package]
name = "bedside-table"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "A small SQLite desktop client built with Bedtime"

[dependencies]
bedtime = { workspace = true }
bedtime-core = { workspace = true }
bedtime-workbench = { workspace = true }
bedtime-storage = { workspace = true }
bedtime-sqlite = { workspace = true }
bevy = { workspace = true, features = ["std"] }
dear-imgui-rs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks", "limits"] }
rfd = { workspace = true }
