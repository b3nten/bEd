[package]
name = "bed"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Minimal Bevy application with a Bedtime workbench"

# bEd as plugins, for the app below and for apps that build on it.
[lib]
path = "lib.rs"

[[bin]]
name = "bed"
path = "src/bed.rs"

[features]
# Let scripts drive the app (tools/bed.py).
automation = ["bedtime/automation"]
# Time every system, for the Schedules panel's timeline.
profile = ["bedtime/profile"]

[dependencies]
# bEd is bedtime's plugins, arranged: everything it's made of comes from here.
bedtime = { workspace = true, features = [
    "workspaces", "documents", "filesystem", "system-fonts",
    "file_explorer", "code", "terminal", "git", "search",
    "markdown", "datatree", "table", "sqlite", "diagram", "hex",
    "image", "audio", "video", "model", "font",
    "http_client", "web", "notes", "schedules", "mascots",
    "cat", "frame_rate",
] }
bevy_egui.workspace = true
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_winit", "bevy_log", "png", "keyboard", "mouse", "x11", "wayland"] }

