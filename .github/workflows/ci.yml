name: Desktop build, native checks and packages

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  remote-helpers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Native musl C compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static helper with vendored Git and zlib
        shell: bash
        run: |
          target_key=${{ matrix.target }}
          target_key=${target_key//-/_}
          linker_key=${target_key^^}
          env "CC_${target_key}=musl-gcc" "CARGO_TARGET_${linker_key}_LINKER=musl-gcc" LIBZ_SYS_STATIC=1 cargo build --locked --release --target ${{ matrix.target }} -p bed-headless
      - name: Check helper CLI and packaging validation
        run: |
          target/${{ matrix.target }}/release/bed-headless --protocol-version
          python3 -m unittest discover -s scripts/tests
      - name: Stage helper with provenance and licenses
        run: python3 scripts/package-remote-helpers.py stage --target ${{ matrix.target }}
      - name: Upload static helper bundle
        uses: actions/upload-artifact@v4
        with:
          name: bed-remote-helper-${{ matrix.target }}
          if-no-files-found: error
          path: target/remote-helpers
  native:
    needs: remote-helpers
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native window/GPU runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox mesa-vulkan-drivers libvulkan1 libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libasound2-dev
      - name: Linux LLDB adapter and fixture compiler
        if: runner.os == 'Linux'
        run: sudo apt-get install -y lldb-18 clang
      - name: Format
        run: cargo fmt --all --check
      - name: Crate boundaries
        run: python3 scripts/check-crate-boundaries.py
      - name: Lint
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Native tests and binary build
        run: cargo test --workspace --locked --all-targets
      - name: Headless services and terminal transport
        run: |
          cargo check --locked -p bed-headless -p bed-session
          cargo test --locked -p bed-terminal --no-default-features
      - name: Native LLDB debugging fixtures (Linux, LLVM 18)
        if: runner.os == 'Linux'
        env:
          BED_LLDB_DAP: /usr/bin/lldb-dap-18
        run: |
          "$BED_LLDB_DAP" --version
          cargo test -p bed-debug --locked --test native_lldb -- --ignored --nocapture
      - name: Native LLDB debugging fixtures (macOS toolchain discovery)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcrun --find lldb-dap
          xcrun lldb-dap --version
          cargo test -p bed-debug --locked --test native_lldb -- --ignored --nocapture
      - name: Release binary
        run: cargo build --locked --release -p bed -p bed-headless --bin bed --bin bed-headless --example embed_host
      - name: Package standalone headless helper and licenses
        run: python3 scripts/package-headless.py
      - name: Download bundled remote helpers
        uses: actions/download-artifact@v4
        with:
          pattern: bed-remote-helper-*
          merge-multiple: true
          path: target/remote-helpers
      - name: Validate bundled remote helpers
        run: python3 scripts/package-remote-helpers.py validate
      - name: Upload standalone headless helper
        uses: actions/upload-artifact@v4
        with:
          name: bed-headless-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: target/headless-package.zip
      - name: Native shader readback fixtures
        run: cargo test -p bed-effects --locked --lib native_shader_fixtures -- --ignored --nocapture
      - name: Native model renderer and shared GPU fixtures
        run: |
          cargo test -p bed-plugin --locked --features gpu native_shared_target -- --ignored --nocapture
          cargo test -p bed-plugin-gltf --locked native_ -- --ignored --nocapture
      - name: Native lifecycle and GPU capture (macOS)
        if: runner.os == 'macOS'
        run: target/release/bed --platform-smoke --lifecycle-smoke --capture-after-frames 30 --capture-frame target/native-window.ppm --config-dir target/native-config src/main.rs
      - name: Native macOS menu Undo and Redo after autosave
        if: runner.os == 'macOS'
        run: target/release/bed --menu-smoke --capture-after-frames 30 --capture-frame target/native-menu-undo.ppm
      - name: Detached native windows and per-window CRT (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/native-project
          cp src/main.rs target/native-project/main.rs
          target/release/bed target/native-project target/native-project/main.rs --viewports-smoke --capture-after-frames 30 --capture-frame target/native-viewports.ppm --config-dir target/native-viewport-config
          test -s target/native-viewports-secondary-1.ppm
          target/release/bed --main-only-smoke --capture-after-frames 30 --capture-frame target/native-internal.ppm --config-dir target/native-internal-config
      - name: Native host-owned embedding (macOS)
        if: runner.os == 'macOS'
        run: target/release/examples/embed_host --smoke-test --capture-frame target/native-embedded.ppm
      - name: Native lifecycle and GPU capture (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a scripts/ci-linux-native.sh
      - name: Native lifecycle and GPU capture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process target/release/bed.exe -ArgumentList '--lifecycle-smoke --capture-after-frames 30 --capture-frame target/native-window.ppm --config-dir target/native-config src/main.rs' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Bed native smoke failed: $($process.ExitCode)" }
          if (!(Test-Path target/native-window.ppm)) { throw 'Native GPU capture is missing.' }
      - name: Native host-owned embedding (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process target/release/examples/embed_host.exe -ArgumentList '--smoke-test --capture-frame target/native-embedded.ppm' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Bed embedding smoke failed: $($process.ExitCode)" }
          if (!(Test-Path target/native-embedded.ppm)) { throw 'Embedding GPU capture is missing.' }
      - name: Detached native windows and per-window CRT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/native-project | Out-Null
          Copy-Item src/main.rs target/native-project/main.rs
          $process = Start-Process target/release/bed.exe -ArgumentList 'target/native-project target/native-project/main.rs --viewports-smoke --capture-after-frames 30 --capture-frame target/native-viewports.ppm --config-dir target/native-viewport-config' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Bed detached-window smoke failed: $($process.ExitCode)" }
          if (!(Test-Path target/native-viewports-secondary-1.ppm)) { throw 'Secondary GPU capture is missing.' }
          $process = Start-Process target/release/bed.exe -ArgumentList '--main-only-smoke --capture-after-frames 30 --capture-frame target/native-internal.ppm --config-dir target/native-internal-config' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Bed internal-renderer smoke failed: $($process.ExitCode)" }
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: scripts/pack-mac.sh
      - name: Package Linux archive and Debian package
        if: runner.os == 'Linux'
        run: scripts/pack-deb.sh
      - name: Package Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/pack-win.ps1
      - name: Upload packages and native capture
        uses: actions/upload-artifact@v4
        with:
          name: bed-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
            target/dist/*.deb
            target/native-window.ppm
            target/native-menu-undo.ppm
            target/native-embedded.ppm
            target/native-viewports*.ppm
            target/native-internal.ppm
          if-no-files-found: error
