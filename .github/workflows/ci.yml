name: Desktop build, native checks and packages

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  remote-helpers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Native musl C compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static helper with vendored Git and zlib
        shell: bash
        run: |
          target_key=${{ matrix.target }}
          target_key=${target_key//-/_}
          linker_key=${target_key^^}
          env "CC_${target_key}=musl-gcc" "CARGO_TARGET_${linker_key}_LINKER=musl-gcc" LIBZ_SYS_STATIC=1 cargo build --locked --release --target ${{ matrix.target }} -p bedtime-remote-agent
      - name: Check helper CLI and packaging validation
        run: |
          target/${{ matrix.target }}/release/bedtime-remote-agent --protocol-version
          python3 -m unittest discover -s scripts/tests
      - name: Stage helper with build metadata and licenses
        run: python3 scripts/lib/remote-helpers.py stage --target ${{ matrix.target }}
      - name: Upload static helper bundle
        uses: actions/upload-artifact@v4
        with:
          name: bed-remote-helper-${{ matrix.target }}
          if-no-files-found: error
          path: target/remote-helpers
  native:
    needs: remote-helpers
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native window/GPU runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox mesa-vulkan-drivers libvulkan1 libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libasound2-dev imagemagick
      - name: Linux LLDB adapter and fixture compiler
        if: runner.os == 'Linux'
        run: sudo apt-get install -y lldb-18 clang
      - name: Format
        run: cargo fmt --all --check
      - name: Crate boundaries
        run: python3 scripts/check-crate-boundaries.py
      - name: Lint
        run: cargo clippy --workspace --locked --all-targets --features bed/automation -- -D warnings
      - name: Native tests and binary build
        run: cargo test --workspace --locked --all-targets --features bed/automation
      - name: Minimal desktop composition
        run: |
          cargo check --locked -p bedtime -p bedtime-core -p bedtime-plugin-layouts -p bedtime-plugin-settings -p bedtime-storage
          cargo check --locked -p bedtime-core --no-default-features --features remote
          cargo check --locked -p bedtime-example-layouts -p bedtime-example-terminal -p bedtime-example-editor -p bedtime-example-model -p bedtime-example-game-editor -p bedtime-example-game-runtime
          cargo check --locked -p bedtime-ui --no-default-features
          python3 scripts/check-desktop-consumer.py
          cargo check --locked -p bed --no-default-features --bins
          cargo test --locked -p bedtime-workbench -p bedtime-core -p bedtime-documents -p bedtime-plugin-layouts -p bedtime-storage -p bedtime-plugin-workspaces
          cargo run --locked -p bedtime-example-editor -- --headless-smoke
      - name: Shared API feature combinations
        shell: bash
        run: |
          cargo check --locked -p bedtime-api --no-default-features --all-targets
          for features in documents gpu documents,gpu language-services; do
            cargo check --locked -p bedtime-api --no-default-features --features "$features" --all-targets
          done
          cargo test --locked -p bedtime-api --all-features
      - name: Independent feature plugins and automation API
        shell: bash
        run: |
          for feature in editor debugger git file-explorer file-search terminal workspaces color-picker settings effects idle source-outline image-viewer model-viewer font-viewer audio-player csv-table markdown-preview json-tree sqlite-browser http-client mascots automation; do
            cargo check --locked -p bed --no-default-features --features "$feature" --bins
          done
          cargo test --locked -p bedtime-plugin-automation --features documents
      - name: Headless services and terminal transport
        run: |
          cargo check --locked -p bedtime-remote-agent -p bedtime-documents
          cargo test --locked -p bedtime-terminal --no-default-features
      - name: Native LLDB debugging fixtures (Linux, LLVM 18)
        if: runner.os == 'Linux'
        env:
          BED_LLDB_DAP: /usr/bin/lldb-dap-18
        run: |
          "$BED_LLDB_DAP" --version
          cargo test -p bedtime-debugger --locked --test native_lldb -- --ignored --nocapture
      - name: Native LLDB debugging fixtures (macOS toolchain discovery)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcrun --find lldb-dap
          xcrun lldb-dap --version
          cargo test -p bedtime-debugger --locked --test native_lldb -- --ignored --nocapture
      - name: Release binary
        run: cargo build --locked --release -p bed -p bedtime-remote-agent --features bed/automation --bin bed --bin bedtime-remote-agent
      - name: Package standalone remote agent and licenses
        run: python3 scripts/lib/remote-helpers.py standalone
      - name: Download bundled remote helpers
        uses: actions/download-artifact@v4
        with:
          pattern: bed-remote-helper-*
          merge-multiple: true
          path: target/remote-helpers
      - name: Validate bundled remote helpers
        run: python3 scripts/lib/remote-helpers.py validate
      - name: Upload standalone remote agent
        uses: actions/upload-artifact@v4
        with:
          name: bed-remote-agent-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: target/remote-agent-package.zip
      - name: Native shader readback fixtures
        run: cargo test -p bedtime-plugin-effects --locked --lib native_shader_fixtures -- --ignored --nocapture
      - name: Native model renderer and shared GPU fixtures
        run: |
          cargo test -p bedtime-plugin-effects --locked --features desktop --lib unified_composition_samples_current_scenes_and_recovers_in_the_same_world -- --ignored --test-threads=1 --nocapture
          cargo test -p bedtime-ui --locked --features imgui,gpu native_shared_target -- --ignored --nocapture
          cargo test -p bedtime-plugin-model-viewer --locked native_ -- --ignored --test-threads=1 --nocapture
      - name: Reusable desktop and layout application (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo run --locked -p bedtime-desktop --example native_smoke
          cargo run --locked -p bedtime-desktop --example canvas_smoke
          cargo run --locked -p bedtime-desktop --example automation_smoke
          cargo run --locked -p bedtime-desktop --example window_config_smoke
          cargo run --locked -p bedtime-desktop --example lifecycle_smoke
          cargo run --locked -p bedtime --example workbench_smoke
          cargo run --locked -p bedtime --example effects_smoke
          cargo run --locked -p bedtime --features language-services --example git_smoke
          cargo run --locked -p bedtime-example-game-editor -- --smoke-test
          cargo run --locked -p bedtime-example-game-runtime -- --smoke-test
          cargo run --locked -p bedtime-example-layouts -- --smoke-test --capture-frame target/native-layout.ppm
          cargo run --locked -p bedtime-example-editor -- --smoke-test
          cargo run --locked -p bedtime-example-model -- --smoke-test
          bash scripts/ci/desktop-consumer.sh
      - name: Independent SQLite application and restart (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --locked -p bedside-table
          python3 bedside-table/scripts/smoke.py --capture-directory target/bedside-captures
      - name: bEd native chrome and GPU capture (macOS)
        if: runner.os == 'macOS'
        run: target/release/bed --platform-smoke --capture-after-frames 30 --capture-frame target/native-window.ppm --config-dir target/native-config bed/src/main.rs
      - name: Native macOS menu Undo and Redo after autosave
        if: runner.os == 'macOS'
        run: target/release/bed --menu-smoke --capture-after-frames 30 --capture-frame target/native-menu-undo.ppm
      - name: Terminal glyphs, images and independent sessions (macOS)
        if: runner.os == 'macOS'
        run: cargo run --locked -p bedtime-example-terminal --example terminal_smoke
      - name: Calling shell workspace promotion (macOS)
        if: runner.os == 'macOS'
        run: target/release/bed --term-promotion-smoke --capture-after-frames 30 --capture-frame target/native-promotion.png
      - name: Shared viewer GPU recovery (macOS)
        if: runner.os == 'macOS'
        run: cargo run --locked -p bedtime --features language-services --example viewers_smoke
      - name: Docked panels and main window composition (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/native-project
          cp bed/src/main.rs target/native-project/main.rs
          target/release/bed --main-only-smoke --capture-after-frames 30 --capture-frame target/native-internal.ppm --config-dir target/native-internal-config
      - name: Native lifecycle and GPU capture (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a scripts/ci/linux-native.sh
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh --skip-build
      - name: Package Linux archive and Debian package
        if: runner.os == 'Linux'
        run: scripts/package-linux.sh --skip-build
      - name: Upload packages and native capture
        uses: actions/upload-artifact@v4
        with:
          name: bed-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
            target/dist/*.deb
            target/native-window.ppm
            target/native-menu-undo.ppm
            target/native-internal.ppm
            target/native-terminal.ppm
            target/native-promotion.png
            target/native-viewers.png
            target/native-layout.ppm
            target/workbench-smoke.png
            target/git-smoke.png
          if-no-files-found: error
