[package]
name = "bedtime-ui2"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "ECS presentation, themes and egui rendering for Bevy"

[dependencies]
bedtime-clipboard2.workspace = true
bevy = { workspace = true, features = ["std", "bevy_render", "bevy_core_pipeline", "bevy_winit", "bevy_log", "keyboard", "mouse"] }
egui.workspace = true
bevy_egui.workspace = true
resvg.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "bevy_log", "x11", "wayland", "png"] }
