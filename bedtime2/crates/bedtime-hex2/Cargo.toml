[package]
name = "bedtime-hex2"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Embeddable read-only virtualized byte viewer"

[features]
default = []
workbench = ["dep:bevy", "dep:bedtime-workbench2", "dep:bedtime-clipboard2"]
automation = ["workbench", "dep:serde_json"]

[dependencies]
bedtime-ui2.workspace = true

bedtime-workbench2 = { path = "../bedtime-workbench2", default-features = false, features = ["ui"], optional = true }
bevy = { workspace = true, features = ["std"], optional = true }
serde_json = { workspace = true, optional = true }

bedtime-clipboard2 = { workspace = true, optional = true }

[dev-dependencies]
bedtime-filesystem2.workspace = true
