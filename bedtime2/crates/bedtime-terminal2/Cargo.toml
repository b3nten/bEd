[package]
name = "bedtime-terminal2"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Local PTY terminal panels with workbench-owned lifetime"

[dependencies]
# Reuse the headless emulator, keyboard encoder and Unix PTY implementation;
# neither the v1 ImGui frontend nor its shell-command plugin is installed.
bedtime-terminal = { path = "../../../bedtime/crates/bedtime-terminal", default-features = false }
bedtime-ui2.workspace = true
bedtime-workbench2 = { path = "../bedtime-workbench2", default-features = false, features = ["ui"] }
bevy = { workspace = true, features = ["std"] }
bevy_egui.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
