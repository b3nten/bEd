[package]
name = "bedtime-workbench2"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Entity-backed workspaces, layouts, panels and commands for Bedtime"

[features]
default = ["ui", "native", "clipboard"]
ui = ["dep:bedtime-ui2", "dep:bevy_egui"]
clipboard = ["dep:bedtime-clipboard2"]
native = ["clipboard", "bedtime-clipboard2/system_clipboard", "bevy/bevy_window", "bevy/mouse", "dep:muda", "dep:raw-window-handle", "dep:objc2", "dep:objc2-quartz-core", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
bevy = { workspace = true, features = ["std", "keyboard"] }
bedtime-clipboard2 = { workspace = true, optional = true }
bedtime-ui2 = { workspace = true, optional = true }
bevy_egui = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true, optional = true }
raw-window-handle = { version = "0.6", optional = true }
objc2 = { workspace = true, optional = true }
objc2-quartz-core = {workspace = true, optional = true, features=["objc2-core-foundation"]}
objc2-app-kit = { workspace = true, optional = true, features = ["NSAppearance", "NSVisualEffectView"] }
objc2-foundation = { workspace = true, optional = true, features = ["NSUserDefaults"] }

[dev-dependencies]
serde_json = { workspace = true }
