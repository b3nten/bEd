[package]
name = "bed"
default-run = "bed"
version = "0.1.0"
edition = "2024"
description = "A desktop application platform and IDE"
publish = false
license.workspace = true

[workspace]
members = [
    "crates/bed-keybindings",
    "crates/bed-plugin-automation",
    "crates/bed-plugin-idle",
    "crates/bed-editing",
    "crates/bed-files",
    "crates/bed-highlight",
    "crates/bed-lsp",
    "crates/bed-debugger",
    "crates/bed-documents",
    "crates/bed-remote",
    "crates/bed-remote-agent",
    "crates/bed-ui",
    "crates/bed-editor-widgets",
    "crates/bed-terminal",
    "crates/bed-plugin-effects",
    "crates/bed-api",
    "crates/bed-workbench",
    "crates/bed-desktop",
    "crates/bed-core",
    "crates/bed-storage",
    "crates/bed-plugin-layouts",
    "examples/layouts",
    "examples/terminal",
    "examples/editor",
    "examples/model",
    "examples/gameplay/game",
    "examples/gameplay/editor",
    "examples/gameplay/runtime",
    "crates/bed-plugin-editor",
    "crates/bed-plugin-debugger",
    "crates/bed-plugin-git",
    "crates/bed-git",
    "crates/bed-plugin-file-explorer",
    "crates/bed-plugin-file-search",
    "crates/bed-plugin-terminal",
    "crates/bed-plugin-workspaces",
    "crates/bed-plugin-color-picker",
    "crates/bed-plugin-mascots",
    "crates/bed-plugin-settings",
    "crates/bed-plugin-source-outline",
    "crates/bed-plugin-image-viewer",
    "crates/bed-plugin-model-viewer",
    "crates/bed-plugin-font-viewer",
    "crates/bed-plugin-audio-player",
    "crates/bed-plugin-csv-table",
    "crates/bed-plugin-markdown-preview",
    "crates/bed-plugin-json-tree",
    "crates/bed-plugin-sqlite-browser",
    "crates/bed-plugin-http-client",
    "crates/bed-launch",
]
default-members = ["."]
exclude = ["vendor/arboard", "vendor/dear-imgui-sys", "vendor/dear-imgui-winit", "vendor/dear-imgui-wgpu", "vendor/freetype-sys", "vendor/bevy_stl", "vendor/rio-vt"]
resolver = "3"

[workspace.package]
license = "GPL-3.0-only"

# Keep workspace code easy to debug while reducing dependency code and unwind
# tables below macOS's compact-unwind limit. The test profile inherits this.
[profile.dev.package."*"]
opt-level = 1

[workspace.dependencies]
bed-keybindings = { path = "crates/bed-keybindings" }
bed-plugin-idle = { path = "crates/bed-plugin-idle" }
bed-plugin-automation = { path = "crates/bed-plugin-automation" }
bed-desktop = { path = "crates/bed-desktop" }
bed-core = { path = "crates/bed-core" }
bed-storage = { path = "crates/bed-storage" }
bed-plugin-layouts = { path = "crates/bed-plugin-layouts" }
bed-workbench = { path = "crates/bed-workbench" }
bed-api = { path = "crates/bed-api", default-features = false }
bed-plugin-color-picker = { path = "crates/bed-plugin-color-picker" }
bed-plugin-mascots = { path = "crates/bed-plugin-mascots" }
bed-git = { path = "crates/bed-git" }
bed-plugin-git = { path = "crates/bed-plugin-git" }
bed-launch = { path = "crates/bed-launch" }
bed-editor-widgets = { path = "crates/bed-editor-widgets" }
bed-plugin-file-explorer = { path = "crates/bed-plugin-file-explorer" }
bed-plugin-file-search = { path = "crates/bed-plugin-file-search" }
bed-plugin-terminal = { path = "crates/bed-plugin-terminal" }
bed-plugin-workspaces = { path = "crates/bed-plugin-workspaces", default-features = false }
bed-plugin-settings = { path = "crates/bed-plugin-settings" }
dear-imgui-rs = { version = "=0.18.0", features = ["build-from-source", "freetype"] }
dear-imgui-sys = { version = "=0.18.0", features = ["bundled-freetype"] }
dear-imgui-wgpu = { version = "=0.18.0", default-features = false, features = ["wgpu-30"] }
winit = "=0.30.13"
wgpu = "=30.0.1"
bevy = { version = "=0.20.0", default-features = false }
bevy_stl = { version = "=0.18.0", default-features = false }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
rfd = "=0.17.2"
serde_json = "1"
pulldown-cmark = "=0.13.4"
jsonc-parser = "=0.33.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy", "gzip", "brotli", "deflate"] }
tokio = { version = "=1.53.2", features = ["rt", "sync", "time", "net", "macros"] }
fontdb = { version = "=0.24.0", default-features = false, features = ["std", "fs", "fontconfig"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
harfrust = "=0.14.0"
wuff = { version = "=0.2.9", default-features = false, features = ["brotli"] }
flate2 = "=1.1.10"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extensions", "KHR_materials_unlit", "KHR_texture_transform", "KHR_materials_emissive_strength"] }
draco-core = { version = "=2.2.1", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
glam = "=0.33.12"
bytemuck = { version = "=1.25.2", features = ["derive"] }
base64 = "=0.22.1"
serde = "=1.0.229"
regex = "=1.12.3"
glob = "=0.3.4"
globset = "=0.4.18"
resvg = { version = "=0.48.1", default-features = false }
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
rio-vt = { version = "=0.5.28", default-features = false, features = ["graphics"] }
rio-graphics = "=0.5.28"
swash = "=0.2.10"
ttf-parser = "=0.25.1"
polling = "=3.11.0"
unicode-width = "=0.2.2"
trash = "=5.2.9"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
object = { version = "=0.37.3", default-features = false, features = ["read", "std"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
libc = "=0.2.190"
muda = { version = "=0.21.0", default-features = false }
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSGeometry", "NSObject", "NSThread", "NSObjCRuntime"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "AppKitDefines", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSLayoutAnchor", "NSLayoutConstraint", "NSResponder", "NSStackView", "NSText", "NSTextField", "NSTitlebarAccessoryViewController", "NSUserInterfaceLayout", "NSView", "NSViewController", "NSVisualEffectView", "NSWindow", "objc2-quartz-core", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
bed-plugin-editor = { path = "crates/bed-plugin-editor" }
bed-plugin-debugger = { path = "crates/bed-plugin-debugger" }
bed-editing = { path = "crates/bed-editing" }
bed-files = { path = "crates/bed-files" }
bed-highlight = { path = "crates/bed-highlight" }
bed-lsp = { path = "crates/bed-lsp" }
bed-documents = { path = "crates/bed-documents" }
bed-ui = { path = "crates/bed-ui", default-features = false }
bed-terminal = { path = "crates/bed-terminal" }
bed-debugger = { path = "crates/bed-debugger" }
bed-plugin-effects = { path = "crates/bed-plugin-effects" }
bed-remote = { path = "crates/bed-remote" }
bed-plugin-source-outline = { path = "crates/bed-plugin-source-outline" }
bed-plugin-image-viewer = { path = "crates/bed-plugin-image-viewer" }
bed-plugin-model-viewer = { path = "crates/bed-plugin-model-viewer" }
bed-plugin-font-viewer = { path = "crates/bed-plugin-font-viewer" }
bed-plugin-audio-player = { path = "crates/bed-plugin-audio-player" }
bed-plugin-csv-table = { path = "crates/bed-plugin-csv-table" }
bed-plugin-markdown-preview = { path = "crates/bed-plugin-markdown-preview" }
bed-plugin-json-tree = { path = "crates/bed-plugin-json-tree" }
bed-plugin-sqlite-browser = { path = "crates/bed-plugin-sqlite-browser" }
bed-plugin-http-client = { path = "crates/bed-plugin-http-client" }

[features]
automation = ["dep:bed-plugin-automation"]
default = ["tools", "effects", "idle", "viewers", "mascots"]
tools = ["editor", "debugger", "git", "file-explorer", "file-search", "terminal", "workspaces", "color-picker", "settings"]
editor = ["dep:bed-plugin-editor", "bed-plugin-editor/language-services"]
debugger = ["dep:bed-plugin-debugger", "dep:bed-debugger"]
git = ["dep:bed-plugin-git"]
file-explorer = ["dep:bed-plugin-file-explorer"]
file-search = ["dep:bed-plugin-file-search"]
terminal = ["dep:bed-plugin-terminal", "bed-plugin-terminal/desktop", "bed-plugin-terminal/remote", "dep:bed-terminal"]
workspaces = []
color-picker = ["dep:bed-plugin-color-picker"]
settings = ["dep:bed-plugin-settings"]
effects = ["bed-plugin-effects/desktop"]
idle = ["dep:bed-plugin-idle"]
viewers = ["source-outline", "image-viewer", "model-viewer", "font-viewer", "audio-player", "csv-table", "markdown-preview", "json-tree", "sqlite-browser", "http-client"]
source-outline = ["dep:bed-plugin-source-outline"]
image-viewer = ["dep:bed-plugin-image-viewer"]
model-viewer = ["dep:bed-plugin-model-viewer", "bed-desktop/scene", "bed-desktop/preview"]
font-viewer = ["dep:bed-plugin-font-viewer"]
audio-player = ["dep:bed-plugin-audio-player"]
csv-table = ["dep:bed-plugin-csv-table"]
markdown-preview = ["dep:bed-plugin-markdown-preview"]
json-tree = ["dep:bed-plugin-json-tree"]
sqlite-browser = ["dep:bed-plugin-sqlite-browser"]
http-client = ["dep:bed-plugin-http-client"]
mascots = ["dep:bed-plugin-mascots", "bed-desktop/scene", "bed-desktop/preview", "bed-plugin-workspaces/mascots", "bed-plugin-idle?/mascots"]

[dependencies]
bed-storage = { workspace = true }
bed-files = { workspace = true, features = ["workspace-services"] }
bed-lsp = { workspace = true }
bed-highlight = { workspace = true }
bed-remote = { workspace = true }
rfd = { workspace = true }
bed-keybindings = { workspace = true }
bed-workbench = { workspace = true }
bed-documents = { workspace = true, features = ["ide-services"] }
bed-plugin-idle = { workspace = true, optional = true }
bed-plugin-automation = { workspace = true, features = ["documents"], optional = true }
bed-desktop = { workspace = true }
bed-core = { workspace = true, features = ["language-services", "remote"] }
bed-plugin-layouts = { workspace = true }
bevy = { workspace = true, features = ["std"] }
bed-plugin-color-picker = { workspace = true, optional = true }
bed-plugin-mascots = { workspace = true, optional = true }
bed-plugin-git = { workspace = true, optional = true }
bed-launch = { workspace = true, features = ["language-services", "remote"] }
bed-editor-widgets = { workspace = true, features = ["language-services"] }
bed-terminal = { workspace = true, optional = true }
bed-plugin-file-explorer = { workspace = true, optional = true }
bed-plugin-file-search = { workspace = true, optional = true }
bed-plugin-terminal = { workspace = true, optional = true }
bed-plugin-workspaces = { workspace = true }
bed-plugin-settings = { workspace = true, optional = true }
bed-api = { workspace = true, features = ["gpu", "language-services", "documents"] }
bed-plugin-editor = { workspace = true, optional = true }
bed-plugin-debugger = { workspace = true, optional = true }
bed-plugin-source-outline = { workspace = true, optional = true }
bed-plugin-image-viewer = { workspace = true, optional = true }
bed-plugin-model-viewer = { workspace = true, optional = true }
bed-plugin-font-viewer = { workspace = true, optional = true }
bed-plugin-audio-player = { workspace = true, optional = true }
bed-plugin-csv-table = { workspace = true, optional = true }
bed-plugin-markdown-preview = { workspace = true, optional = true }
bed-plugin-json-tree = { workspace = true, optional = true }
bed-plugin-sqlite-browser = { workspace = true, optional = true }
bed-plugin-http-client = { workspace = true, optional = true }
bed-editing = { workspace = true }
bed-ui = { workspace = true, features = ["imgui", "gpu"] }
bed-debugger = { workspace = true, optional = true }
bed-plugin-effects = { workspace = true }
dear-imgui-rs = { workspace = true }
dear-imgui-sys = { workspace = true }
dear-imgui-wgpu = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "app_remote_editor"
path = "tests/app_remote_editor.rs"
harness = false
required-features = ["editor", "workspaces"]

[[test]]
name = "lsp_transport"
path = "tests/lsp_transport.rs"
harness = false
required-features = ["editor"]

[patch.crates-io]
rio-vt = { path = "vendor/rio-vt" }
arboard = { path = "vendor/arboard" }
dear-imgui-sys = { path = "vendor/dear-imgui-sys" }
dear-imgui-wgpu = { path = "vendor/dear-imgui-wgpu" }
bevy_stl = { path = "vendor/bevy_stl" }

[dev-dependencies]
bed-plugin-csv-table = { workspace = true, features = ["test-support"] }
bed-remote = { workspace = true }
bed-files = { workspace = true }
bed-lsp = { workspace = true }
bed-documents = { workspace = true }
bed-plugin-debugger = { workspace = true, features = ["test-support"] }
bed-plugin-source-outline = { workspace = true }
bed-plugin-image-viewer = { workspace = true }
bed-plugin-model-viewer = { workspace = true }
bed-plugin-font-viewer = { workspace = true }
bed-plugin-audio-player = { workspace = true }
bed-plugin-markdown-preview = { workspace = true }
bed-plugin-json-tree = { workspace = true }
bed-plugin-sqlite-browser = { workspace = true }
bed-plugin-http-client = { workspace = true }
bed-plugin-mascots = { workspace = true }
