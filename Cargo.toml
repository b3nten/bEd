    "bedtime2/crates/bedtime-automation2",
    "bedtime2/crates/bedtime-ui2",
    "bedtime2/crates/bedtime-mascots2",
    "bedtime2/crates/bedtime-editor2",
    "bedtime2/crates/bedtime-document2",
    "bedtime2/crates/bedtime-image2",
    "bedtime2/crates/bedtime-model2",
    "bedtime2/crates/bedtime-hex2",
    "bedtime2/crates/bedtime-lsp2",
    "bedtime2/crates/bedtime-workbench2",
    "bedtime2/crates/bedtime-terminal2",
    "bedtime2/crates/bedtime-filetree2",
    "bedtime2/crates/bedtime-filesystem2",
    "bedtime/crates/bedtime-sqlite",
    "bedtime/crates/bedtime-keybindings",
    "bedtime/crates/bedtime-plugin-automation",
    "bedtime/crates/bedtime-plugin-idle",
    "bedtime/crates/bedtime-editing",
    "bedtime/crates/bedtime-files",
    "bedtime/crates/bedtime-highlight",
    "bedtime/crates/bedtime-lsp",
    "bedtime/crates/bedtime-debugger",
    "bedtime/crates/bedtime-documents",
    "bedtime/crates/bedtime-remote",
    "bedtime/crates/bedtime-remote-agent",
    "bedtime/crates/bedtime-ui",
    "bedtime/crates/bedtime-editor-widgets",
    "bedtime/crates/bedtime-terminal",
    "bedtime/crates/bedtime-plugin-effects",
    "bedtime/crates/bedtime-api",
    "bedtime/crates/bedtime-workbench",
    "bedtime/crates/bedtime-desktop",
    "bedtime/crates/bedtime-core",
    "bedtime/crates/bedtime-storage",
    "bedtime/crates/bedtime-plugin-layouts",
    "bedtime/examples/layouts",
    "bedtime/examples/terminal",
    "bedtime/examples/editor",
    "bedtime/examples/model",
    "bedtime/examples/gameplay/game",
    "bedtime/examples/gameplay/editor",
    "bedtime/examples/gameplay/runtime",
    "bedtime/crates/bedtime-plugin-editor",
    "bedtime/crates/bedtime-plugin-debugger",
    "bedtime/crates/bedtime-plugin-git",
    "bedtime/crates/bedtime-git",
    "bedtime/crates/bedtime-plugin-file-explorer",
    "bedtime/crates/bedtime-plugin-file-search",
    "bedtime/crates/bedtime-plugin-terminal",
    "bedtime/crates/bedtime-plugin-workspaces",
    "bedtime/crates/bedtime-plugin-color-picker",
    "bedtime/crates/bedtime-plugin-mascots",
    "bedtime/crates/bedtime-plugin-settings",
    "bedtime/crates/bedtime-plugin-source-outline",
    "bedtime/crates/bedtime-plugin-image-viewer",
    "bedtime/crates/bedtime-plugin-model-viewer",
    "bedtime/crates/bedtime-plugin-font-viewer",
    "bedtime/crates/bedtime-plugin-audio-player",
    "bedtime/crates/bedtime-plugin-csv-table",
    "bedtime/crates/bedtime-plugin-markdown-preview",
    "bedtime/crates/bedtime-plugin-json-tree",
    "bedtime/crates/bedtime-plugin-sqlite-browser",
    "bedtime/crates/bedtime-plugin-http-client",
    "bedtime/crates/bedtime",
    "bedtime/crates/bedtime-test-fixtures",
]
default-members = ["bed"]
exclude = ["vendor/arboard", "vendor/dear-imgui-sys", "vendor/dear-imgui-wgpu", "vendor/egui", "vendor/freetype-sys", "vendor/rio-vt"]
resolver = "3"

[workspace.package]
version = "0.1.0"
license = "GPL-3.0-only"

# Keep workspace code easy to debug while reducing dependency code and unwind
# tables below macOS's compact-unwind limit. The test profile inherits this.
[profile.dev.package."*"]
opt-level = 1

[workspace.dependencies]
bedtime-document2 = { path = "bedtime2/crates/bedtime-document2" }
bedtime-model2 = { path = "bedtime2/crates/bedtime-model2" }
bedtime-image2 = { path = "bedtime2/crates/bedtime-image2" }
bedtime-hex2 = { path = "bedtime2/crates/bedtime-hex2" }
bedtime-mascots2 = { path = "bedtime2/crates/bedtime-mascots2" }
bedtime-grammars2 = { path = "bedtime2/crates/bedtime-grammars2" }
bedtime-treesitter2 = { path = "bedtime2/crates/bedtime-treesitter2" }
bed-structure2 = { path = "bed2/crates/bed-structure2" }
bedtime-automation2 = { path = "bedtime2/crates/bedtime-automation2" }
bedtime-clipboard2 = { path = "bedtime2/crates/bedtime-clipboard2", default-features = false }
bedtime-ui2 = { path = "bedtime2/crates/bedtime-ui2" }
bedtime-editor2 = { path = "bedtime2/crates/bedtime-editor2" }
bedtime-lsp2 = { path = "bedtime2/crates/bedtime-lsp2" }
bedtime-workbench2 = { path = "bedtime2/crates/bedtime-workbench2" }
bedtime-terminal2 = { path = "bedtime2/crates/bedtime-terminal2" }
bedtime-filetree2 = { path = "bedtime2/crates/bedtime-filetree2" }
bedtime-filesystem2 = { path = "bedtime2/crates/bedtime-filesystem2" }
bedtime-sqlite = { path = "bedtime/crates/bedtime-sqlite", version = "0.1.0" }
bedtime-keybindings = { path = "bedtime/crates/bedtime-keybindings" }
bedtime-plugin-idle = { path = "bedtime/crates/bedtime-plugin-idle" }
bedtime-plugin-automation = { path = "bedtime/crates/bedtime-plugin-automation" }
bedtime-desktop = { path = "bedtime/crates/bedtime-desktop" }
bedtime-core = { path = "bedtime/crates/bedtime-core" }
bedtime-storage = { path = "bedtime/crates/bedtime-storage" }
bedtime-plugin-layouts = { path = "bedtime/crates/bedtime-plugin-layouts" }
bedtime-workbench = { path = "bedtime/crates/bedtime-workbench" }
bedtime-api = { path = "bedtime/crates/bedtime-api", default-features = false }
bedtime-plugin-color-picker = { path = "bedtime/crates/bedtime-plugin-color-picker" }
bedtime-plugin-mascots = { path = "bedtime/crates/bedtime-plugin-mascots" }
bedtime-git = { path = "bedtime/crates/bedtime-git" }
bedtime-plugin-git = { path = "bedtime/crates/bedtime-plugin-git" }
bedtime = { path = "bedtime/crates/bedtime" }
bedtime-editor-widgets = { path = "bedtime/crates/bedtime-editor-widgets" }
bedtime-plugin-file-explorer = { path = "bedtime/crates/bedtime-plugin-file-explorer" }
bedtime-plugin-file-search = { path = "bedtime/crates/bedtime-plugin-file-search" }
bedtime-plugin-terminal = { path = "bedtime/crates/bedtime-plugin-terminal" }
bedtime-plugin-workspaces = { path = "bedtime/crates/bedtime-plugin-workspaces", default-features = false }
bedtime-plugin-settings = { path = "bedtime/crates/bedtime-plugin-settings" }
dear-imgui-rs = { version = "=0.18.0", features = ["build-from-source", "freetype"] }
dear-imgui-sys = { version = "=0.18.0", features = ["bundled-freetype"] }
dear-imgui-wgpu = { version = "=0.18.0", default-features = false, features = ["wgpu-30"] }
winit = "=0.30.13"
wgpu = "=30.0.1"
bevy = { version = "=0.20.0", default-features = false }
egui = "=0.36.2"
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
stl_io = "=0.10.0"
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
rfd = "=0.17.2"
serde_json = "1"
pulldown-cmark = "=0.13.4"
