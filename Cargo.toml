[package]
name = "bed"
default-run = "bed"
version = "0.1.0"
edition = "2024"
description = "A desktop text editor with dockable tools, SSH projects and embeddable document views"
publish = false
license.workspace = true

[workspace]
members = [
    "crates/bed-keybindings",
    "crates/bed-runtime",
    "crates/bed-automation",
    "crates/bed-idle",
    "crates/bed-editing",
    "crates/bed-files",
    "crates/bed-highlight",
    "crates/bed-lsp",
    "crates/bed-debug-core",
    "crates/bed-document-session",
    "crates/bed-remote",
    "crates/bed-headless",
    "crates/bed-ui",
    "crates/bed-editor-ui",
    "crates/bed-terminal-core",
    "crates/bed-config",
    "crates/bed-effects-config",
    "crates/bed-effects",
    "crates/bed-editor-api",
    "crates/bed-workbench-api",
    "crates/bed-workbench",
    "crates/bed-desktop",
    "examples/layout-app",
    "crates/bed-editor",
    "crates/bed-debug",
    "crates/bed-git",
    "crates/bed-git-core",
    "crates/bed-explorer",
    "crates/bed-search",
    "crates/bed-terminal",
    "crates/bed-projects",
    "crates/bed-color",
    "crates/bed-scenes",
    "crates/bed-settings",
    "crates/bed-outline",
    "crates/bed-image",
    "crates/bed-model-viewer",
    "crates/bed-font",
    "crates/bed-audio",
    "crates/bed-csv",
    "crates/bed-markdown",
    "crates/bed-json",
    "crates/bed-sqlite",
    "crates/bed-http",
    "crates/bed-editor-workbench",
    "crates/bedterm",
]
default-members = [".", "crates/bedterm"]
exclude = ["vendor/arboard", "vendor/dear-imgui-sys", "vendor/dear-imgui-winit", "vendor/dear-imgui-wgpu", "vendor/freetype-sys", "vendor/bevy_stl", "vendor/rio-vt"]
resolver = "3"

[workspace.package]
license = "GPL-3.0-only"

[workspace.dependencies]
bed-keybindings = { path = "crates/bed-keybindings" }
bed-idle = { path = "crates/bed-idle" }
bed-automation = { path = "crates/bed-automation" }
bed-desktop = { path = "crates/bed-desktop" }
bed-workbench = { path = "crates/bed-workbench" }
bed-workbench-api = { path = "crates/bed-workbench-api" }
bed-runtime = { path = "crates/bed-runtime" }
bed-color = { path = "crates/bed-color" }
bed-scenes = { path = "crates/bed-scenes" }
bed-git-core = { path = "crates/bed-git-core" }
bed-git = { path = "crates/bed-git" }
bed-effects-config = { path = "crates/bed-effects-config" }
bed-editor-workbench = { path = "crates/bed-editor-workbench" }
bed-editor-ui = { path = "crates/bed-editor-ui" }
bed-config = { path = "crates/bed-config" }
bed-explorer = { path = "crates/bed-explorer" }
bed-search = { path = "crates/bed-search" }
bed-terminal = { path = "crates/bed-terminal" }
bed-projects = { path = "crates/bed-projects", default-features = false }
bed-settings = { path = "crates/bed-settings" }
dear-imgui-rs = { version = "=0.18.0", features = ["build-from-source", "freetype"] }
dear-imgui-sys = { version = "=0.18.0", features = ["bundled-freetype"] }
dear-imgui-wgpu = { version = "=0.18.0", default-features = false, features = ["wgpu-30"] }
winit = "=0.30.13"
wgpu = "=30.0.1"
bevy = { version = "=0.20.0", default-features = false }
bevy_stl = { version = "=0.18.0", default-features = false }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
rfd = "=0.17.2"
serde_json = "1"
pulldown-cmark = "=0.13.4"
jsonc-parser = "=0.33.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy", "gzip", "brotli", "deflate"] }
tokio = { version = "=1.53.2", features = ["rt", "sync", "time", "net", "macros"] }
fontdb = { version = "=0.24.0", default-features = false, features = ["std", "fs", "fontconfig"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
harfrust = "=0.14.0"
wuff = { version = "=0.2.9", default-features = false, features = ["brotli"] }
flate2 = "=1.1.10"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extensions", "KHR_materials_unlit", "KHR_texture_transform", "KHR_materials_emissive_strength"] }
draco-core = { version = "=2.2.1", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
glam = "=0.33.12"
bytemuck = { version = "=1.25.2", features = ["derive"] }
base64 = "=0.22.1"
serde = "=1.0.229"
regex = "=1.12.3"
glob = "=0.3.4"
globset = "=0.4.18"
resvg = { version = "=0.48.1", default-features = false }
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
rio-vt = { version = "=0.5.28", default-features = false, features = ["graphics"] }
rio-graphics = "=0.5.28"
swash = "=0.2.10"
ttf-parser = "=0.25.1"
polling = "=3.11.0"
unicode-width = "=0.2.2"
trash = "=5.2.9"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
object = { version = "=0.37.3", default-features = false, features = ["read", "std"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

libc = "=0.2.190"
muda = { version = "=0.21.0", default-features = false }
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSGeometry", "NSObject", "NSThread", "NSObjCRuntime"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "AppKitDefines", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSLayoutAnchor", "NSLayoutConstraint", "NSResponder", "NSStackView", "NSText", "NSTextField", "NSTitlebarAccessoryViewController", "NSUserInterfaceLayout", "NSView", "NSViewController", "NSVisualEffectView", "NSWindow", "objc2-quartz-core", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
bed-editor-api = { path = "crates/bed-editor-api" }
bed-editor = { path = "crates/bed-editor" }
bed-debug = { path = "crates/bed-debug" }
bed-editing = { path = "crates/bed-editing" }
bed-files = { path = "crates/bed-files" }
bed-highlight = { path = "crates/bed-highlight" }
bed-lsp = { path = "crates/bed-lsp" }
bed-document-session = { path = "crates/bed-document-session" }
bed-ui = { path = "crates/bed-ui", default-features = false }
bed-terminal-core = { path = "crates/bed-terminal-core" }
bed-debug-core = { path = "crates/bed-debug-core" }
bed-effects = { path = "crates/bed-effects" }
bed-remote = { path = "crates/bed-remote" }
bed-outline = { path = "crates/bed-outline" }
bed-image = { path = "crates/bed-image" }
bed-model-viewer = { path = "crates/bed-model-viewer" }
bed-font = { path = "crates/bed-font" }
bed-audio = { path = "crates/bed-audio" }
bed-csv = { path = "crates/bed-csv" }
bed-markdown = { path = "crates/bed-markdown" }
bed-json = { path = "crates/bed-json" }
bed-sqlite = { path = "crates/bed-sqlite" }
bed-http = { path = "crates/bed-http" }

[features]
automation = ["dep:bed-automation", "dep:bed-document-session"]
default = ["tools", "effects", "idle", "viewers", "scenes"]
tools = ["editor", "debug", "git", "explorer", "search", "terminal", "projects", "color", "settings"]
editor = ["dep:bed-editor"]
debug = ["dep:bed-debug", "dep:bed-debug-core"]
git = ["dep:bed-git"]
explorer = ["dep:bed-explorer"]
search = ["dep:bed-search"]
terminal = ["dep:bed-terminal", "bed-terminal/desktop", "dep:bed-terminal-core", "dep:bedterm"]
projects = ["dep:bed-projects"]
color = ["dep:bed-color"]
settings = ["dep:bed-settings"]
effects = ["dep:bed-effects"]
idle = ["dep:bed-idle"]
viewers = ["structure", "images", "models", "fonts", "audio", "csv", "markdown", "json", "sqlite", "http"]
structure = ["dep:bed-outline"]
images = ["dep:bed-image"]
models = ["dep:bed-model-viewer", "bed-runtime/scene"]
fonts = ["dep:bed-font"]
audio = ["dep:bed-audio"]
csv = ["dep:bed-csv"]
markdown = ["dep:bed-markdown"]
json = ["dep:bed-json"]
sqlite = ["dep:bed-sqlite"]
http = ["dep:bed-http"]
scenes = ["dep:bed-scenes", "bed-runtime/scene", "bed-projects?/scenes", "bed-idle?/scenes"]

[dependencies]
bed-keybindings = { workspace = true }
bed-workbench = { workspace = true }
bed-document-session = { workspace = true, optional = true }
bed-idle = { workspace = true, optional = true }
bed-automation = { workspace = true, features = ["editor"], optional = true }
bed-desktop = { workspace = true }
bed-runtime = { workspace = true, features = ["render"] }
bevy = { workspace = true, features = ["std"] }
bed-color = { workspace = true, optional = true }
bed-scenes = { workspace = true, optional = true }
bedterm = { path = "crates/bedterm", optional = true }
bed-git = { workspace = true, optional = true }
bed-editor-workbench = { workspace = true }
bed-editor-ui = { workspace = true }
bed-terminal-core = { workspace = true, optional = true }
bed-config = { workspace = true }
bed-explorer = { workspace = true, optional = true }
bed-search = { workspace = true, optional = true }
bed-terminal = { workspace = true, optional = true }
bed-projects = { workspace = true, optional = true }
bed-settings = { workspace = true, optional = true }
bed-editor-api = { workspace = true, features = ["gpu"] }
bed-editor = { workspace = true, optional = true }
bed-debug = { workspace = true, optional = true }
bed-outline = { workspace = true, optional = true }
bed-image = { workspace = true, optional = true }
bed-model-viewer = { workspace = true, optional = true }
bed-font = { workspace = true, optional = true }
bed-audio = { workspace = true, optional = true }
bed-csv = { workspace = true, optional = true }
bed-markdown = { workspace = true, optional = true }
bed-json = { workspace = true, optional = true }
bed-sqlite = { workspace = true, optional = true }
bed-http = { workspace = true, optional = true }
bed-editing = { workspace = true }
bed-ui = { workspace = true, features = ["imgui", "gpu"] }
bed-debug-core = { workspace = true, optional = true }
bed-effects = { workspace = true, features = ["desktop"], optional = true }
dear-imgui-rs = { workspace = true }
dear-imgui-sys = { workspace = true }
dear-imgui-wgpu = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "lsp_transport"
path = "tests/lsp_transport.rs"
harness = false

[patch.crates-io]
rio-vt = { path = "vendor/rio-vt" }
arboard = { path = "vendor/arboard" }
dear-imgui-sys = { path = "vendor/dear-imgui-sys" }
dear-imgui-wgpu = { path = "vendor/dear-imgui-wgpu" }
bevy_stl = { path = "vendor/bevy_stl" }

[dev-dependencies]
bed-remote = { workspace = true }
bed-files = { workspace = true }
bed-lsp = { workspace = true }
bed-document-session = { workspace = true }
bed-debug = { workspace = true, features = ["test-support"] }

bed-outline = { workspace = true }
bed-image = { workspace = true }
bed-model-viewer = { workspace = true }
bed-font = { workspace = true }
bed-audio = { workspace = true }
bed-csv = { workspace = true }
bed-markdown = { workspace = true }
bed-json = { workspace = true }
bed-sqlite = { workspace = true }
bed-http = { workspace = true }
bed-scenes = { workspace = true }
