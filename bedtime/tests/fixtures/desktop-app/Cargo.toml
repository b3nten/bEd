[package]
name = "desktop-consumer"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately isolated: workspace feature unification cannot hide coupling.
[workspace]

# Keep dependency-heavy rendering responsive in the sample's development build.
[profile.dev.package."*"]
opt-level = 1

[features]
default = []
layout = ["dep:bedtime-workbench", "dep:serde_json"]
effects = ["dep:bedtime-plugin-effects"]

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std"] }
bedtime-desktop = { path = "../../../crates/bedtime-desktop" }
bedtime-workbench = { path = "../../../crates/bedtime-workbench", optional = true }
bedtime-plugin-effects = { path = "../../../crates/bedtime-plugin-effects", features = ["desktop"], optional = true }
serde_json = { version = "1", optional = true }

# These integration patches are currently required by the desktop renderer.
[patch.crates-io]
arboard = { path = "../../../../vendor/arboard" }
dear-imgui-sys = { path = "../../../../vendor/dear-imgui-sys" }
dear-imgui-wgpu = { path = "../../../../vendor/dear-imgui-wgpu" }
