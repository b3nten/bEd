[package]
name = "bedtime-example-terminal"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
bevy = { workspace = true, features = ["std"] }
bedtime = { workspace = true }
bedtime-plugin-terminal = { workspace = true, features = ["desktop"] }
serde_json = { workspace = true }

[dev-dependencies]
bedtime-plugin-automation = { workspace = true, features = ["documents"] }
bedtime-plugin-csv-table = { workspace = true }
bedtime-plugin-image-viewer = { workspace = true }
bedtime-terminal = { workspace = true, features = ["ui"] }
winit = { workspace = true }

[[example]]
name = "terminal_smoke"
path = "src/smoke.rs"
