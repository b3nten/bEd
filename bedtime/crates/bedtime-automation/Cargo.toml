[package]
name = "bedtime-automation"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Drive a bedtime app from scripts over the Bevy Remote Protocol"

[features]
# Without this the plugin does nothing and pulls in nothing, so an app can
# always add it and enable automation only in the builds that want it.
enabled = [
    "dep:bedtime-ui",
    "dep:bedtime-actions",
    "dep:serde",
    "dep:serde_json",
    "bevy/bevy_remote",
    "bevy/serialize",
    "bevy/png",
]

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_window", "bevy_render", "keyboard", "mouse"] }
bedtime-ui = { workspace = true, optional = true, features = ["accessibility"] }
bedtime-actions = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
