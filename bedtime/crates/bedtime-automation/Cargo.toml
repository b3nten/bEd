[package]
name = "bedtime-automation"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Optional stdin/stdout automation for Bevy and Bedtime applications"

[features]
default = ["workbench"]
ui = ["dep:bedtime-ui", "dep:bevy_egui", "dep:bedtime-clipboard"]
workbench = ["ui", "dep:bedtime-workbench"]

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_render", "bevy_winit", "keyboard", "mouse", "serialize"] }
bedtime-ui = { workspace = true, optional = true }
bevy_egui = { workspace = true, optional = true }
bedtime-workbench = { workspace = true, optional = true }
bedtime-clipboard = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
image = { workspace = true, features = ["png"] }

[dev-dependencies]
bedtime-workbench = { path = "../bedtime-workbench", default-features = false, features = ["test-support"] }
bevy = { workspace = true, features = ["bevy_core_pipeline", "async_executor", "multi_threaded", "bevy_log", "x11", "wayland"] }

