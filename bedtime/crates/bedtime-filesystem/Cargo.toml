[package]
name = "bedtime-filesystem"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Headless native file sources, checked streaming writes and filesystem operations"

[features]
default = []
workbench = ["dep:bevy", "dep:bedtime-workbench"]

[dependencies]
bevy = { workspace = true, features = ["std"], optional = true }
bedtime-workbench = { path = "../bedtime-workbench", default-features = false, optional = true }
bedtime-document.workspace = true
trash.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = { version = "=8.2.0", default-features = false }
