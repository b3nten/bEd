[package]
name = "bedtime-web"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "A web browser panel for workbench apps (macOS, with the system's web view)"

[dependencies]
bedtime-ui.workspace = true
bedtime-workbench = { workspace = true, features = ["persistence"] }
bevy = { workspace = true, features = ["std", "bevy_render"] }
bevy_egui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
wry = "=0.57.2"
block2 = "=0.6.2"
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSImage", "NSImageRep", "NSGraphicsContext", "NSView", "NSWindow", "NSResponder", "objc2-core-graphics"] }
objc2-foundation = { workspace = true, features = ["NSError", "NSDictionary"] }
objc2-web-kit = { version = "=0.3.2", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
