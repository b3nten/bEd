[package]
name = "bedtime-editor"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Embeddable plain text editor with optional Workbench document integration"

[features]
default = []
diff = []
treesitter = ["dep:bedtime-treesitter", "bedtime-treesitter/documents"]
workbench = ["dep:bedtime-workbench"]

[dependencies]
bedtime-document.workspace = true
bedtime-treesitter = { workspace = true, optional = true }
bedtime-ui.workspace = true
bedtime-workbench = { path = "../bedtime-workbench", default-features = false, optional = true }
bevy = { workspace = true, features = ["std"] }
unicode-segmentation = "=1.13.3"
unicode-width.workspace = true

[dev-dependencies]
bedtime-workbench = { path = "../bedtime-workbench", default-features = false, features = ["test-support"] }
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "bevy_log", "x11", "wayland"] }

[[example]]
name = "syntax"
required-features = ["treesitter"]
