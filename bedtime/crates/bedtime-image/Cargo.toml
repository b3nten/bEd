[package]
name = "bedtime-image"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Embeddable static image decoding and zoom/pan canvas"

[features]
default = []
workbench = ["dep:bedtime-workbench"]

[dependencies]
bedtime-ui.workspace = true
bedtime-workbench = { path = "../bedtime-workbench", default-features = false, features = ["ui"], optional = true }
bevy = { workspace = true, features = ["std"] }
image = { workspace = true, features = ["bmp", "dds", "exr", "gif", "hdr", "ico", "pnm", "qoi", "tga", "tiff", "webp"] }
resvg = { workspace = true, features = ["text", "system-fonts", "raster-images"] }
