[package]
name = "bedtime-table"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "A CSV and TSV table view of text documents for workbench apps: edit cells, rows and columns; sort and filter"

[features]
default = ["persistence"]
# Save table panels with the layout.
persistence = ["bedtime-workbench/persistence"]

[dependencies]
bedtime-document.workspace = true
bedtime-ui.workspace = true
bedtime-workbench = { workspace = true, features = ["files"] }
bevy = { workspace = true, features = ["std"] }
