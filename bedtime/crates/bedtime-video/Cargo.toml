[package]
name = "bedtime-video"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "A video player for workbench apps (macOS, with AVFoundation)"

[features]
default = ["persistence"]
# Save video panels with the layout.
persistence = ["bedtime-workbench/persistence"]

[dependencies]
bedtime-document.workspace = true
bedtime-filesystem.workspace = true
bedtime-ui.workspace = true
bedtime-workbench = { workspace = true, features = ["files"] }
bevy = { workspace = true, features = ["std", "bevy_render"] }
bevy_egui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSURL", "NSDictionary", "NSValue", "NSError", "NSString"] }
objc2-av-foundation = { version = "=0.3.2", features = ["objc2-core-media", "objc2-core-video"] }
objc2-core-media = "=0.3.2"
objc2-core-video = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-quartz-core = { workspace = true, features = ["CABase"] }
