[package]
name = "bedtime-actions"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Actions, their handlers and keybindings for Bevy apps"

[features]
default = []
settings = ["dep:bedtime-settings", "dep:bedtime-persistence"]
ui = ["dep:bedtime-ui", "dep:bevy_egui", "bevy/bevy_window", "bedtime-settings?/ui"]

[dependencies]
bedtime-persistence = { workspace = true, optional = true }
bedtime-settings = { workspace = true, optional = true }
bedtime-ui = { workspace = true, optional = true }
bevy = { workspace = true, features = ["std", "keyboard", "serialize"] }
bevy_egui = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
ron = "0.12.2"
