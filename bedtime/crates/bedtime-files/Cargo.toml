[package]
name = "bedtime-files"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
file-services = ["dep:bedtime-remote"]
workspace-services = ["file-services", "dep:git2"]

[dependencies]
bedtime-editing = { workspace = true }
bevy = { workspace = true, features = ["std"] }
bedtime-remote = { workspace = true, optional = true }
git2 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
