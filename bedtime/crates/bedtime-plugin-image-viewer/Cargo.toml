[package]
name = "bedtime-plugin-image-viewer"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
bedtime-keybindings = { workspace = true }
bedtime-editing = { workspace = true }
bedtime-api = { workspace = true, features = ["gpu", "documents"] }
bevy = { workspace = true, features = ["std"] }
bedtime-ui = { workspace = true, features = ["imgui", "gpu"] }
dear-imgui-rs = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["bmp", "dds", "exr", "gif", "hdr", "ico", "pnm", "qoi", "tga", "tiff", "webp"] }
resvg = { workspace = true, features = ["text", "system-fonts", "raster-images"] }
