[package]
name = "bedtime-ui"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "ECS presentation, themes and egui rendering for Bevy"

[features]
# `CodeView` colours code itself, with bedtime-syntax (tree-sitter).
syntax = ["dep:bedtime-syntax"]
# `image`: decoding, `ImageView`, and egui loaders so `egui::Image` shows files.
# `data`: JSON and TOML as a `Value` tree, and `DataTree` drawing it.
data = ["dep:toml"]
# `markdown`: parsing and `MarkdownView` (documents, tooltips).
markdown = ["dep:pulldown-cmark"]
image = ["dep:image", "resvg/text", "resvg/system-fonts", "resvg/raster-images"]
# `InstalledFonts`: discover installed font families.
system-fonts = ["dep:fontdb"]
# `AccessibilityTree`: egui's AccessKit tree, recorded each frame.
accessibility = []
# Layouts are saved (`Persist`), and layout templates.
persistence = ["dep:bedtime-persistence", "dep:bevy_world_serialization", "bevy/serialize"]
# macOS window chrome: titlebar measurement, blur, background.
native = ["dep:objc2", "dep:objc2-quartz-core", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:raw-window-handle"]

[dependencies]
bedtime-syntax = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
toml = { workspace = true, optional = true, features = ["std", "parse", "serde", "preserve_order"] }
image = { workspace = true, optional = true, features = ["bmp", "dds", "exr", "gif", "hdr", "ico", "pnm", "qoi", "tga", "tiff", "webp"] }
bedtime-clipboard.workspace = true
bedtime-ui-macros.workspace = true
bedtime-persistence = { workspace = true, optional = true }
bevy_world_serialization = { version = "=0.20.0", optional = true }
bevy = { workspace = true, features = ["std", "bevy_render", "bevy_core_pipeline", "bevy_winit", "bevy_log", "keyboard", "mouse"] }
egui.workspace = true
fontdb = { workspace = true, optional = true }
bevy_egui.workspace = true
resvg.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ron = "0.12.2"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = { version = "0.6", optional = true }
objc2 = { workspace = true, optional = true }
objc2-quartz-core = {workspace = true, optional = true, features=["objc2-core-foundation"]}
objc2-app-kit = { workspace = true, optional = true, features = ["NSAppearance", "NSApplication", "NSVisualEffectView"] }
objc2-foundation = { workspace = true, optional = true, features = ["NSUserDefaults"] }

[dev-dependencies]
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "bevy_log", "x11", "wayland", "png"] }
