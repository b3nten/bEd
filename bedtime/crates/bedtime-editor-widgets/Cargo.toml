[package]
name = "bedtime-editor-widgets"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
language-services = ["dep:bedtime-highlight", "bedtime-documents/ide-services", "bedtime-ui/documentation-syntax"]

[dependencies]
bedtime-keybindings = { workspace = true }
bedtime-editing = { workspace = true }
bedtime-documents = { workspace = true }
bedtime-highlight = { workspace = true, optional = true }
bedtime-ui = { workspace = true, features = ["imgui", "documentation"] }
dear-imgui-rs = { workspace = true }
dear-imgui-sys = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
