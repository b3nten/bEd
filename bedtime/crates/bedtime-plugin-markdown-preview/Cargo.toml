[package]
name = "bedtime-plugin-markdown-preview"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
bevy = { workspace = true, features = ["std"] }
bedtime-api = { workspace = true, features = ["gpu", "documents"] }
bedtime-files = { workspace = true, features = ["file-services"] }
bedtime-editing = { workspace = true }
bedtime-plugin-image-viewer = { workspace = true }
bedtime-remote = { workspace = true }
bedtime-ui = { workspace = true, features = ["imgui", "gpu"] }
dear-imgui-rs = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
