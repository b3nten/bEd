[package]
name = "bedtime-mascots"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Bed and Ducky: mascot scenes for workbench apps"

[features]
default = ["persistence"]
# Save mascot panels with the layout.
persistence = ["bedtime-workbench/persistence"]

[dependencies]
bedtime-ui.workspace = true
bedtime-workbench.workspace = true
bevy = { workspace = true, features = ["std", "bevy_asset", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "png"] }
gltf.workspace = true
rodio.workspace = true

[dev-dependencies]
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "bevy_winit", "bevy_log", "x11", "wayland"] }
