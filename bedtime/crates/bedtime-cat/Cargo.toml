[package]
name = "bedtime-cat"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "A cat that lives in a bedtime app's window"

[dependencies]
bedtime-ui.workspace = true
bedtime-workbench = { workspace = true, features = ["persistence"] }
