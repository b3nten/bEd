[package]
name = "bedtime-workbench"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "World sessions, layouts, panels, documents and commands for Bedtime"

[features]
default = ["ui", "native", "clipboard"]
ui = ["dep:bevy_egui", "bedtime-settings?/ui", "bedtime-actions/ui", "bedtime-menus/ui"]
clipboard = ["dep:bedtime-clipboard"]
persistence = ["dep:bedtime-persistence", "dep:bedtime-settings", "bedtime-actions/settings", "bedtime-ui/persistence", "dep:bevy_world_serialization", "bevy/serialize"]
# Workspaces: folders with their own store and settings, switched by
# rebuilding the App (needs the bevy_winit fork's `relaunch`).
workspaces = ["persistence", "bevy/bevy_winit"]
native = ["clipboard", "bedtime-clipboard/system_clipboard", "bevy/bevy_window", "bevy/mouse", "bedtime-menus/native", "bedtime-ui/native"]

[dependencies]
bedtime-actions.workspace = true
bedtime-menus.workspace = true
bedtime-document.workspace = true
bedtime-work.workspace = true
bedtime-persistence = { workspace = true, optional = true }
bedtime-settings = { workspace = true, optional = true }
bevy_world_serialization = { version = "=0.20.0", optional = true }
bevy = { workspace = true, features = ["std", "keyboard", "bevy_log"] }
bedtime-clipboard = { workspace = true, optional = true }
bedtime-ui.workspace = true
bevy_egui = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
