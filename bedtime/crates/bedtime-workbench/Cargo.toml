[package]
name = "bedtime-workbench"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "World sessions, layouts, panels, documents and commands for Bedtime"

[features]
test-support = []
default = ["ui", "native", "clipboard"]
ui = ["dep:bedtime-ui", "dep:bevy_egui"]
clipboard = ["dep:bedtime-clipboard"]
persistence = ["dep:bevy_world_serialization", "dep:ron", "bevy/bevy_asset", "bevy/serialize"]
native = ["clipboard", "bedtime-clipboard/system_clipboard", "bevy/bevy_window", "bevy/mouse", "dep:muda", "dep:raw-window-handle", "dep:objc2", "dep:objc2-quartz-core", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
bedtime-document.workspace = true
bevy_world_serialization = { version = "=0.20.0", optional = true }
ron = { version = "0.12.2", optional = true }
bevy = { workspace = true, features = ["std", "keyboard"] }
bedtime-clipboard = { workspace = true, optional = true }
bedtime-ui = { workspace = true, optional = true }
bevy_egui = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true, optional = true }
raw-window-handle = { version = "0.6", optional = true }
objc2 = { workspace = true, optional = true }
objc2-quartz-core = {workspace = true, optional = true, features=["objc2-core-foundation"]}
objc2-app-kit = { workspace = true, optional = true, features = ["NSAppearance", "NSVisualEffectView"] }
objc2-foundation = { workspace = true, optional = true, features = ["NSUserDefaults"] }

[dev-dependencies]
serde_json = { workspace = true }
