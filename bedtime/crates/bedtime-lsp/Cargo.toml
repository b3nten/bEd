[package]
name = "bedtime-lsp"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Managed local language servers for canonical Bedtime documents"

[features]
default = []
workbench = ["dep:bedtime-workbench", "bedtime-editor/workbench"]

[dependencies]
bedtime-editor.workspace = true
bedtime-workbench = { path = "../bedtime-workbench", default-features = false, optional = true }
bevy = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true

[dev-dependencies]
bedtime-workbench = { path = "../bedtime-workbench", default-features = false, features = ["test-support"] }
