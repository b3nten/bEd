[package]
name = "bedtime-plugin-workspaces"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = ["mascots"]
remote = ["bedtime-core/remote"]
mascots = ["dep:bedtime-plugin-mascots"]

[dependencies]
rfd = { workspace = true }
bedtime-core = { workspace = true }
bedtime-storage = { workspace = true }
bedtime-files = { workspace = true }
bedtime-workbench = { workspace = true }
bedtime-documents = { workspace = true }
bedtime-plugin-mascots = { workspace = true, optional = true }
bedtime-ui = { workspace = true, features = ["imgui", "gpu"] }
bedtime-api = { workspace = true, features = ["gpu", "documents"] }
bevy = { workspace = true, features = ["std"] }
dear-imgui-rs = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
bedtime-workbench = { workspace = true }
