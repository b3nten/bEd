[package]
name = "bedtime-font"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "A font viewer for workbench apps: a type preview and every glyph, with outlines"

[features]
default = ["persistence"]
# Save font panels with the layout.
persistence = ["bedtime-workbench/persistence"]

[dependencies]
bedtime-document.workspace = true
bedtime-filesystem.workspace = true
bedtime-ui.workspace = true
bedtime-workbench = { workspace = true, features = ["files"] }
bevy = { workspace = true, features = ["std"] }
# The version egui draws text with.
skrifa = "=0.44.0"
resvg.workspace = true
