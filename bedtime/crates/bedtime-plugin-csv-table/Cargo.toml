[package]
name = "bedtime-plugin-csv-table"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
test-support = []

[dependencies]
bedtime-keybindings = { workspace = true }
bedtime-ui = { workspace = true, features = ["imgui"] }
bedtime-editing = { workspace = true }
bedtime-api = { workspace = true  , features = ["documents"] }
bevy = { workspace = true, features = ["std"] }
bedtime-documents = { workspace = true }
dear-imgui-rs = { workspace = true }
dear-imgui-sys = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
bedtime-core = { workspace = true }
bedtime-files = { workspace = true }
bedtime-workbench = { workspace = true }
bedtime-plugin-editor = { workspace = true }

[[test]]
name = "transactions"
path = "tests/transactions.rs"
required-features = ["test-support"]
