[package]
name = "bedtime-hex"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "A hex viewer for workbench apps: any file's bytes, with find and go to offset"

[features]
default = ["persistence"]
# Save hex panels with the layout.
persistence = ["bedtime-workbench/persistence"]

[dependencies]
bedtime-document.workspace = true
bedtime-filesystem.workspace = true
bedtime-ui.workspace = true
bedtime-workbench = { workspace = true, features = ["files"] }
bevy = { workspace = true, features = ["std"] }
