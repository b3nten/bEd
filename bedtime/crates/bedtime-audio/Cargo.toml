[package]
name = "bedtime-audio"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "An audio player for workbench apps: waveform, spectrum and spectrogram views"

[features]
default = ["persistence"]
# Save audio panels with the layout.
persistence = ["bedtime-workbench/persistence"]

[dependencies]
bedtime-document.workspace = true
bedtime-filesystem.workspace = true
bedtime-ui.workspace = true
bedtime-workbench = { workspace = true, features = ["files"] }
bevy = { workspace = true, features = ["std"] }
rodio.workspace = true
rustfft = "=6.4.1"
