[package]
name = "bedtime-filetree"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Lazy native filesystem panels with application-owned roots and file opening"

[dependencies]
bedtime-filesystem.workspace = true
bedtime-clipboard.workspace = true
bedtime-ui.workspace = true
bedtime-workbench = { path = "../bedtime-workbench", default-features = false, features = ["ui"] }
bevy = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = ["NSPasteboard"] }
