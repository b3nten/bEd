[package]
name = "bedtime-treesitter"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Shared incremental code analysis using selected Arborium grammars"

[features]
documents = ["dep:bedtime-document"]

[dependencies]
bedtime-document = { workspace = true, optional = true }
bedtime-grammars.workspace = true
# Use one pinned native runtime: Cargo permits only one links=tree-sitter.
tree-sitter = { package = "arborium-tree-sitter", version = "=2.18.2" }
serde_json.workspace = true
