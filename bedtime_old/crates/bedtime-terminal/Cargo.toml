[package]
name = "bedtime-terminal"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Local PTY terminal panels with workbench-owned lifetime"

[dependencies]
bedtime-ui.workspace = true
bedtime-workbench = { path = "../bedtime-workbench", default-features = false, features = ["ui"] }
bevy = { workspace = true, features = ["std"] }
bevy_egui.workspace = true

rio-vt.workspace = true
rio-graphics.workspace = true
polling.workspace = true
unicode-width.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
