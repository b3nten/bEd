[package]
name = "bed2"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Application scaffold for the second Bedtime foundation"

[features]
automation = ["dep:bedtime-automation2", "bedtime-hex2/automation"]

[dependencies]
bedtime-filesystem2 = { workspace = true, features = ["workbench"] }
bedtime-model2 = { workspace = true, features = ["workbench"] }
bedtime-image2 = { workspace = true, features = ["workbench"] }
bedtime-hex2 = { workspace = true, features = ["workbench"] }
bedtime-mascots2 = { workspace = true, features = ["workbench"] }
bedtime-git.workspace = true
pulldown-cmark.workspace = true
bed-structure2.workspace = true
bedtime-treesitter2.workspace = true
bedtime-editor2 = { workspace = true, features = ["workbench", "treesitter", "diff"] }
bedtime-lsp2 = { workspace = true, features = ["workbench"] }
bedtime-automation2 = { workspace = true, optional = true }
bedtime-ui2.workspace = true
bedtime-filetree2.workspace = true
bedtime-terminal2.workspace = true
bedtime-workbench2 = { workspace = true, features = ["ui", "persistence"] }
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_winit", "bevy_log", "keyboard", "mouse", "x11", "wayland"] }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
rfd.workspace = true
bevy_egui.workspace = true
fontdb.workspace = true

ron = "0.12.2"
blake3 = "1"

[dev-dependencies]
bedtime-workbench2 = { path = "../bedtime2/crates/bedtime-workbench2", default-features = false, features = ["test-support"] }
bevy_world_serialization = "=0.20.0"
base64.workspace = true
wgpu.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
