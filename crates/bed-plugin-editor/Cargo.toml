[package]
name = "bed-plugin-editor"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
language-services = ["dep:bed-highlight", "dep:bed-lsp", "bed-documents/ide-services", "bed-api/language-services", "bed-editor-widgets/language-services"]

[dependencies]
bed-keybindings = { workspace = true }
bevy = { workspace = true, features = ["std"] }
bed-api = { workspace = true, features = ["documents"] }
bed-workbench = { workspace = true }
bed-editing = { workspace = true }
bed-highlight = { workspace = true, optional = true }
bed-lsp = { workspace = true, optional = true }
bed-documents = { workspace = true }
bed-ui = { workspace = true, features = ["imgui"] }
bed-editor-widgets = { workspace = true }
dear-imgui-rs = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
bed-core = { workspace = true, features = ["language-services"] }
bed-files = { workspace = true }
