[package]
name = "bed-plugin-markdown-preview"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
bevy = { workspace = true, features = ["std"] }
bed-api = { workspace = true, features = ["gpu", "documents"] }
bed-documents = { workspace = true, features = ["ide-services"] }
bed-editing = { workspace = true }
bed-plugin-image-viewer = { workspace = true }
bed-remote = { workspace = true }
bed-ui = { workspace = true, features = ["imgui", "gpu"] }
dear-imgui-rs = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
