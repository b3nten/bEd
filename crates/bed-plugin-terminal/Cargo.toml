[package]
name = "bed-plugin-terminal"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:bed-desktop", "dep:winit"]
remote = ["bed-terminal/remote", "bed-documents/remote"]

[dependencies]
bed-keybindings = { workspace = true }
bevy = { workspace = true, features = ["std"] }
bed-api = { workspace = true, features = ["documents"] }
bed-terminal = { workspace = true, features = ["ui"] }
bed-ui = { workspace = true, features = ["imgui"] }
bed-documents = { workspace = true }
dear-imgui-rs = { workspace = true }
serde_json = { workspace = true }

bed-workbench = { workspace = true }
bed-desktop = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[dev-dependencies]
bed-remote = { workspace = true }
bed-core = { workspace = true }
