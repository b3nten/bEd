[package]
name = "bed-launch"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Owned startup for Bevy desktop applications"

[features]
default = []
remote = ["bed-core/remote"]
language-services = ["bed-core/language-services", "bed-api/language-services"]

[dependencies]
bed-api = { workspace = true, features = ["documents"] }
bed-core = { workspace = true }
bed-desktop = { workspace = true }
bed-ui = { workspace = true, features = ["imgui", "gpu"] }
bevy = { workspace = true, features = ["std"] }
serde_json = { workspace = true }

[dev-dependencies]
bed-workbench = { workspace = true }
bed-plugin-automation = { workspace = true, features = ["documents"] }
bed-plugin-editor = { workspace = true, features = ["language-services"] }
bed-plugin-git = { workspace = true }
bed-plugin-debugger = { workspace = true }
bed-plugin-terminal = { workspace = true, features = ["desktop"] }
bed-debugger = { workspace = true }
bed-plugin-image-viewer = { workspace = true }
bed-plugin-model-viewer = { workspace = true }
bed-plugin-effects = { workspace = true, features = ["desktop"] }
wgpu = { workspace = true }
winit = { workspace = true }

[[example]]
name = "git_smoke"
required-features = ["language-services"]

[[example]]
name = "debugger_smoke"
required-features = ["language-services"]

[[example]]
name = "viewers_smoke"
required-features = ["language-services"]
