[package]
name = "bed-ui"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
imgui = ["dep:dear-imgui-rs", "dep:dear-imgui-sys", "dep:fontdb", "dep:resvg"]
documentation = ["imgui", "dep:bed-highlight"]
gpu = ["dep:bevy", "dep:wgpu"]

[dependencies]
bed-highlight = { workspace = true, optional = true }
bevy = { workspace = true, optional = true, features = ["std"] }
wgpu = { workspace = true, optional = true }
dear-imgui-rs = { workspace = true, optional = true }
dear-imgui-sys = { workspace = true, optional = true }
fontdb = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }

[[example]]
name = "flat_dockspace_probe"
required-features = ["imgui"]
