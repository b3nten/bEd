[package]
name = "bed-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
preview = ["bevy/reflect_auto_register", "bevy/bevy_anti_alias", "bevy/bevy_log", "bevy/png", "bevy/jpeg", "bevy/webp"]
# Exact component names are needed for Bevy GPU recovery.
scene = ["preview", "bevy/debug", "bevy/bevy_pbr", "bevy/bevy_mikktspace", "bevy/bevy_gltf"]

[dependencies]
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_render", "bevy_core_pipeline", "bevy_winit", "keyboard", "mouse", "x11", "wayland"] }
dear-imgui-rs = { workspace = true }
dear-imgui-sys = { workspace = true }
dear-imgui-wgpu = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
image = { workspace = true }
bed-ui = { workspace = true, features = ["imgui", "gpu"] }
arboard = { workspace = true, features = ["image-data"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "=2.21.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSData"] }
objc2-app-kit = { workspace = true }
objc2-quartz-core = { workspace = true }

[dev-dependencies]
bed-app = { workspace = true }
