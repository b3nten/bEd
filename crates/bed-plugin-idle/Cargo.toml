[package]
name = "bed-plugin-idle"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
mascots = ["dep:bed-plugin-mascots", "dep:bed-api"]

[dependencies]
bed-ui = { workspace = true, features = ["imgui", "gpu"] }
bevy = { workspace = true, features = ["std"] }
bed-desktop = { workspace = true }
winit = { workspace = true }
dear-imgui-rs = { workspace = true }

bed-plugin-mascots = { workspace = true, optional = true }
bed-api = { workspace = true, features = ["gpu", "documents"], optional = true }
