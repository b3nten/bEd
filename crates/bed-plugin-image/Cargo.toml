[package]
name = "bed-plugin-image"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"

[dependencies]
bed-editing = { workspace = true }
bed-plugin = { workspace = true, features = ["gpu"] }
bed-ui = { workspace = true }
dear-imgui-rs = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["bmp", "dds", "exr", "gif", "hdr", "ico", "pnm", "qoi", "tga", "tiff", "webp"] }
resvg = { workspace = true, features = ["text", "system-fonts", "raster-images"] }
