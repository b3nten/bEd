[package]
name = "bed-image"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
bed-keybindings = { workspace = true }
bed-editing = { workspace = true }
bed-editor-api = { workspace = true, features = ["gpu"] }
bed-workbench-api = { workspace = true }
bevy = { workspace = true, features = ["std"] }
bed-ui = { workspace = true, features = ["imgui", "gpu"] }
dear-imgui-rs = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["bmp", "dds", "exr", "gif", "hdr", "ico", "pnm", "qoi", "tga", "tiff", "webp"] }
resvg = { workspace = true, features = ["text", "system-fonts", "raster-images"] }
