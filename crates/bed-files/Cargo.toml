[package]
name = "bed-files"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
workspace-services = ["dep:bed-remote", "dep:git2"]

[dependencies]
bed-editing = { workspace = true }
bed-remote = { workspace = true, optional = true }
git2 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[[test]]
name = "remote_services"
path = "tests/remote_services.rs"
harness = false
required-features = ["workspace-services"]
