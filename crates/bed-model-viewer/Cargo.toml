[package]
name = "bed-model-viewer"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
bed-keybindings = { workspace = true }
bed-workbench-api = { workspace = true }
bed-runtime = { workspace = true, features = ["scene"] }
bed-editing = { workspace = true }
bed-editor-api = { workspace = true, features = ["gpu"] }
bed-ui = { workspace = true, features = ["imgui", "gpu"] }
dear-imgui-rs = { workspace = true }
serde_json = { workspace = true }
gltf = { workspace = true }
draco-core = { workspace = true }
meshopt = "=0.6.2"
glam = { workspace = true }
image = { workspace = true, features = ["hdr", "webp"] }
half = { version = "2.7", default-features = false }
bytemuck = { workspace = true }
base64 = { workspace = true }
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "reflect_auto_register", "bevy_asset", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_anti_alias", "bevy_log", "bevy_mikktspace", "bevy_gltf", "png", "jpeg", "webp"] }
bevy_stl = { workspace = true }
