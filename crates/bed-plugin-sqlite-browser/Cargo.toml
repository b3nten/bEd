[package]
name = "bed-plugin-sqlite-browser"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
bed-ui = { workspace = true, features = ["imgui"] }
bed-keybindings = { workspace = true }
bed-editing = { workspace = true }
bed-api = { workspace = true  , features = ["documents"] }
bevy = { workspace = true, features = ["std"] }
dear-imgui-rs = { workspace = true }
dear-imgui-sys = { workspace = true }
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks", "limits"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
