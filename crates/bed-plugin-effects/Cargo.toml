[package]
name = "bed-plugin-effects"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
gpu = ["dep:wgpu"]
desktop = ["gpu", "dep:bevy", "dep:bed-desktop", "dep:dear-imgui-rs", "dep:dear-imgui-wgpu"]

[dependencies]
bevy = { workspace = true, features = ["std"], optional = true }
bed-desktop = { workspace = true, optional = true }
dear-imgui-rs = { workspace = true, optional = true }
dear-imgui-wgpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
serde_json = { workspace = true }
