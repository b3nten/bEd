[package]
name = "bed-terminal"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:bed-desktop", "dep:winit"]

[dependencies]
bed-keybindings = { workspace = true }
bevy = { workspace = true, features = ["std"] }
bed-workbench-api = { workspace = true }
bed-terminal-core = { workspace = true, features = ["ui"] }
bed-ui = { workspace = true, features = ["imgui"] }
bed-document-session = { workspace = true }
bed-editor-api = { workspace = true }
dear-imgui-rs = { workspace = true }
serde_json = { workspace = true }

bed-workbench = { workspace = true }
bed-desktop = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[dev-dependencies]
bed-remote = { workspace = true }
bed-config = { workspace = true }
bed-editor-workbench = { workspace = true }
bed-editor = { workspace = true }
