[package]
name = "bed-api"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
documents = ["dep:bed-editing", "dep:bed-documents"]
language-services = ["documents", "dep:bed-lsp", "bed-documents/ide-services"]
gpu = ["bed-ui/gpu", "dep:wgpu"]

[dependencies]
bed-ui = { workspace = true, features = ["documentation"] }
bed-keybindings = { workspace = true }
bed-editing = { workspace = true, optional = true }
bed-documents = { workspace = true, optional = true }
bed-lsp = { workspace = true, optional = true }
bevy = { workspace = true, features = ["std"] }
dear-imgui-rs = { workspace = true }
dear-imgui-sys = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true, optional = true }
