[package]
name = "bed-app"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Owned startup for Bevy desktop applications"

[features]
default = []
remote = ["bed-core/remote"]
language-services = ["bed-core/language-services", "bed-api/language-services"]

[dependencies]
bed-api = { workspace = true, features = ["documents"] }
bed-core = { workspace = true }
bed-desktop = { workspace = true }
bed-ui = { workspace = true, features = ["imgui", "gpu"] }
bevy = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
