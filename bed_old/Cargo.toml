[package]
name = "bed_old"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "IDE built on the Bedtime desktop foundation"

[features]
automation = ["dep:bedtime-automation", "bedtime-hex/automation"]

[dependencies]
bedtime-filesystem = { workspace = true, features = ["workbench"] }
bedtime-model = { workspace = true, features = ["workbench"] }
bedtime-image = { workspace = true, features = ["workbench"] }
bedtime-hex = { workspace = true, features = ["workbench"] }
bedtime-mascots = { workspace = true, features = ["workbench"] }
bedtime-git.workspace = true
pulldown-cmark.workspace = true
bed-structure.workspace = true
bedtime-treesitter.workspace = true
bedtime-editor = { workspace = true, features = ["workbench", "treesitter", "diff"] }
bedtime-lsp = { workspace = true, features = ["workbench"] }
bedtime-automation = { workspace = true, optional = true }
bedtime-ui.workspace = true
bedtime-filetree.workspace = true
bedtime-terminal.workspace = true
bedtime-workbench = { workspace = true, features = ["ui", "persistence"] }
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_winit", "bevy_log", "keyboard", "mouse", "x11", "wayland"] }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
rfd.workspace = true
bevy_egui.workspace = true
fontdb.workspace = true

ron = "0.12.2"
blake3 = "1"

[dev-dependencies]
bedtime-workbench = { path = "../bedtime/crates/bedtime-workbench", default-features = false, features = ["test-support"] }
bevy_world_serialization = "=0.20.0"
base64.workspace = true
wgpu.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
