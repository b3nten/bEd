[package]
name = "bed-structure"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true

[dependencies]
bedtime-treesitter.workspace = true
bedtime-editor = { workspace = true, features = ["workbench", "treesitter"] }
bedtime-workbench = { workspace = true, features = ["ui"] }
bedtime-ui.workspace = true
bevy = { workspace = true, features = ["std"] }

[dev-dependencies]
bedtime-workbench = { path = "../../../bedtime/crates/bedtime-workbench", default-features = false, features = ["test-support"] }
